data:
  n_samples: 1280000
  radius: 2.0
  std_clean: 0.2
  gpu_batch_gen: true
noise:
  sigma_min: 0.01
  sigma_max: 10.0
  schedule: geometric
  n_sigma_levels: 15
  condition: full_spd
  beta_min: 1.3
  beta_max: 2.0
  lambda_min: 1.0
  lambda_max: 2.5
  rho_min: 0.01
  rho_max: 10.0
  anchor_probability: 0.35
  spd:
    radius_max: 0.7
    radial_distribution: uniform_area
  anchors:
    - beta: 1.4
      lam: 1.8
      rho: 0.316846
      u: 0.0
      v: 0.0
